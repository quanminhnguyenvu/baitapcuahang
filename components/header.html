<!-- ==========================================================================
  MINI SHOP - REUSABLE HEADER COMPONENT
  Hướng dẫn sử dụng: Nhúng trực tiếp vào thẻ <header id="site-header" class="site-header">
  hoặc sử dụng ShopComponents.renderHeader('#site-header', { active: 'home' })
========================================================================== -->
<header id="site-header" class="site-header">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a href="index.html" class="header-brand" aria-label="Trang chủ Mini Shop">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
          <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>
        </svg>
      </span>
      <span class="brand-name">Mini Shop</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="header-nav" aria-label="Chính">
      <a href="index.html" class="nav-link active" data-nav="home">Home</a>
      <a href="products.html" class="nav-link" data-nav="products">Products</a>
      <a href="about.html" class="nav-link" data-nav="about">About</a>
      <a href="contact.html" class="nav-link" data-nav="contact">Contact</a>
    </nav>

    <!-- Header Actions (Search, Cart & Auth) -->
    <div class="header-actions">
      <!-- Search Bar -->
      <form class="header-search" role="search" onsubmit="event.preventDefault();">
        <input type="search" class="search-input" placeholder="Search products..." aria-label="Tìm kiếm sản phẩm">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </form>

      <!-- Cart Icon Button -->
      <a href="cart.html" class="header-cart-btn" aria-label="Giỏ hàng Mini Shop" title="Xem giỏ hàng">
        <svg class="cart-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" id="cartBadge" aria-label="Số lượng sản phẩm trong giỏ">0</span>
      </a>

      <!-- Auth & Admin Buttons -->
      <div class="auth-group">
        <a href="login.html" class="btn btn-outline-blue">Login</a>
        <a href="register.html" class="btn btn-blue">Register</a>
        <a href="admin.html" class="btn btn-outline-green">Admin</a>
      </div>
    </div>

    <!-- Mobile Header Right Group -->
    <div class="mobile-header-right">
      <a href="cart.html" class="header-cart-btn mobile-cart-btn" aria-label="Giỏ hàng Mini Shop" title="Xem giỏ hàng">
        <svg class="cart-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge mobile-cart-badge">0</span>
      </a>
      <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Mở menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="mobile-drawer" id="mobileDrawer">
    <div class="mobile-drawer-content">
      <form class="mobile-search" role="search" onsubmit="event.preventDefault();">
        <input type="search" class="search-input" placeholder="Search products..." aria-label="Tìm kiếm sản phẩm">
      </form>

      <nav class="mobile-nav-links">
        <a href="index.html" class="mobile-nav-link active" data-nav="home">Home</a>
        <a href="products.html" class="mobile-nav-link" data-nav="products">Products</a>
        <a href="cart.html" class="mobile-nav-link" data-nav="cart" style="display: flex; align-items: center; justify-content: space-between;">
          <span>Giỏ hàng</span>
          <span class="drawer-cart-badge">0</span>
        </a>
        <a href="about.html" class="mobile-nav-link" data-nav="about">About</a>
        <a href="contact.html" class="mobile-nav-link" data-nav="contact">Contact</a>
      </nav>

      <div class="mobile-actions">
        <a href="login.html" class="btn btn-outline-blue">Login</a>
        <a href="register.html" class="btn btn-blue">Register</a>
        <a href="admin.html" class="btn btn-outline-green">Admin</a>
      </div>
    </div>
  </div>
</header>
